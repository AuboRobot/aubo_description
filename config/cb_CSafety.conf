# ENUM_ITEM(EmergencyStop, 1, "安全输入触发急停")               \
# ENUM_ITEM(SafeguardStop, 2, "安全输入触发防护停止, 边沿触发")   \
# ENUM_ITEM(SafeguardReset, 3, "安全输入触发防护重置, 边沿触发")  \
# ENUM_ITEM(ThreePositionSwitch, 4, "3档位使能开关")           \
# ENUM_ITEM(OperationalMode, 5, "切换自动模式和手动模式")        \
# ENUM_ITEM(HandGuide, 6, "切换自动模式和手动模式")              \
# ENUM_ITEM(ReducedMode, 7, "安全参数切换1(缩减模式)，序号越低优先级越高，三路输出都无效时，选用第0组安全参数")         \
# ENUM_ITEM(AutomaticModeSafeguardStop, 8, "自动模式下防护停机输入(需要配置三档位使能设备)") \
# ENUM_ITEM(AutomaticModeSafeguardRest, 9, "自动模式下上升沿触发防护重置(需要配置三档位使能设备)")
[ConfigurableDI]
    num = 12
    label = "Configurable Input"
    name = [ "CI00", "CI01", "CI02", "CI03", "CI04", "CI05",
             "CI10", "CI11", "CI12", "CI13", "CI14", "CI15" ]

# ENUM_ITEM(Unassigned, 0, "安全输出未定义")                       \
# ENUM_ITEM(SystemEmergencyStop, 1, "安全输出指示是否急停")         \
# ENUM_ITEM(NotSystemEmergencyStop, 2, "安全输出指示是否急停")      \
# ENUM_ITEM(RobotMoving, 3, "安全输出指示机器人是否在运动")          \
# ENUM_ITEM(RobotNotMoving, 4, "安全输出指示机器人是否停止运动")      \
# ENUM_ITEM(ReducedMode, 5, "安全输出指示机器人是否处于缩减模式")      \
# ENUM_ITEM(NotReducedMode, 6, "安全输出指示机器人是否不处于缩减模式")  \
# ENUM_ITEM(SafeHome, 7, "安全输出指示机器人是否已经处于安全Home位姿")
[ConfigurableDO]
    num = 12
    label = "Configurable Output"
    name = [ "CO00", "CO01", "CO02", "CO03", "CO04", "CO05",
             "CO10", "CO11", "CO12", "CO13", "CO14", "CO15" ]


[ToolAI]
    num = 2 
    name = "TOOL_AI"
    type = [ 1, 1 ]
    min = [ 0, 0 ]
    max = [ 10, 10 ]

[ToolAO]
    num = 0
    name = "TOOL_AO"

# 以下属IS/S/C系列虚拟的固化功能的联动IO
# 联动IO 输入功能
# EI00: 紧急停止EI0
# EI01: 紧急停止EI1
# RMTON: 远程开机
# RMTOFF: 远程关机
[LinkDI]
    num = 4
    label = "Link Input"
    function_lock = true
    name = [ "EI0", "EI1", "RMTON", "RMTOFF" ]
    sequence = [3,  2,  1,  0]

[SerialPort]
    device_list = ["ttyS0","ttyIfaceBrd","ttyRobotTool"]
    alias = ["[I/O] A1,B1","[I/O] A2,B2","Tool RS485"]

[Firmware]
    master_mcu = 'controlbox_CSafety_h100'
    slave_mcu = 'controlbox_slave_CSafety_h100'

# 控制手柄
[Handle]
    intergated = true
    custom_func_key = 'HandGuide' # 回到原点GoHome、拖动示教HandGuide、记录点位RecordPoint、轨迹复现RepeatTrack  

[sensor]
    temperature = true
    humidity = true

[WiFi]
    wnic_intergated = true  # 是否集成无线网卡
    wifi_prefix = "AUBO-CCSafety-" # AP WiFi 名字前缀

# 示教方式
[PrimaryHmi]
    default = "webscope" # 默认方式
    allowed = ["webscope", "aubo_scope"] # 支持的方式

