# 以下属于aubo接口板特有的固化功能的联动IO

# 联动IO 输入功能
# START_PROGRAM: 启动工程或者恢复工程
# STOP_PROGRAM: 停止工程
# PAUSE_PROGRAM: 暂停工程
# GO_HOME: 回到HOME位姿
# POPUP_DISMISS: 点击弹窗上的 OK 按键

# 联动IO 输出功能
# Running: 工程正在运行中
# Stopped: 工程已经停止运行
# Paused: 工程被暂停
# AtHome: 机器人当前处于HOME位姿

# INPUT_DEFAULT = 0,
# FREEDRIVE = 1,
# GO_HOME = 2,
# START_PROGRAM = 3,
# STOP_PROGRAM = 4,
# PAUSE_PROGRAM = 5,
# POPUP_DISMISS = 6,
[LinkDI]
    num = 15
    label = "Link Input"
    function_lock = true
    name = [ "LI00", "LI01", "LI02", "LI03", "RV1", "LI04", "LI05", "F1",   
             "F2",   "F3",   "F4",   "F5",   "F6", "RV3", "RV4" ]

# OUTPUT_DEFAULT = 0,
# LOW_WHEN_NOT_RUNNING = 1,
# HIGH_WHEN_NOT_RUNNING = 2,
# HIGH_WHEN_RUNNING_LOW_WHEN_STOP = 3,
# HIGH_WHEN_PAUSED = 4,
# AT_HOME = 5
[LinkDO]
    num = 5
    label = "Link Output"
    function_lock = true
    name = ["LO00", "LO01", "LO02", "LO03", "RV2"] 

[SerialPort]
    device_list = ["ttyS2","ttyRobotTool"]
    alias = ["Modbus RTU","Tool RS485"]
    
[LinkModeButton]
    enable = true

[Firmware]
    master_mcu = 'controlbox_i_h400'
    slave_mcu = 'controlbox_slave_i_h400'

# 控制手柄
[Handle]
    intergated = false
    custom_func_key = 'HandGuide' # 回到原点GoHome、拖动示教HandGuide、记录点位RecordPoint、轨迹复现RepeatTrack     

[sensor]
    temperature = true
    humidity = true

# 示教方式
[PrimaryHmi]
    default = "aubo_scope" # 默认方式
    allowed = ["webscope", "aubo_scope"] # 支持的方式

