[StandardDI]
    num = 8
    name = [ "DI00", "DI01", "DI02", "DI03", "DI04", "DI05", "DI06", "DI07" ]

[StandardDO]
    num = 8
    name = [ "DO00", "DO01", "DO02", "DO03", "DO04", "DO05", "DO06", "DO07" ]

# 工具端数字可变IO
[ToolDIO]
    num = 4
    name = "TOOL_IO"

