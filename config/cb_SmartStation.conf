[ConfigurableDI]
    num = 8
    label = "Safety Input"
    name = [ "SI00", "SI01", "SI02", "SI03",
             "SI10", "SI11", "SI12", "SI13"]
    safety_function = [ 0, 0, 0, 0, 
                        0, 0, 0, 0 ]


# ENUM_ITEM(Unassigned, 0, "安全输出未定义")                       \
# ENUM_ITEM(SystemEmergencyStop, 1, "安全输出指示是否急停")         \
# ENUM_ITEM(NotSystemEmergencyStop, 2, "安全输出指示是否急停")      \
# ENUM_ITEM(RobotMoving, 3, "安全输出指示机器人是否在运动")          \
# ENUM_ITEM(RobotNotMoving, 4, "安全输出指示机器人是否停止运动")      \
# ENUM_ITEM(ReducedMode, 5, "安全输出指示机器人是否处于缩减模式")      \
# ENUM_ITEM(NotReducedMode, 6, "安全输出指示机器人是否不处于缩减模式")  \
# ENUM_ITEM(SafeHome, 7, "安全输出指示机器人是否已经处于安全Home位姿")
[ConfigurableDO]
    num = 8
    label = "Safety Output"
    name = ["SO00", "SO01", "SO02", "SO03",
            "SO10", "SO11", "SO12", "SO13"]
    safety_function = [ 0, 0, 0, 0, 
                        0, 0, 0, 0 ]

[StandardAI]
    num = 2
    name = ["VI1","VI2"]
    type = [ 1, 1 ]
    min = [ 0, 0 ]
    max = [ 10, 10 ]


# type 类型: 1-电压  2-电流
[StandardAO]
    num = 2 #2路模拟量电压输出
    name = ["VO1", "VO2"]
    type = [ 1, 1 ]
    min = [ 0, 0 ]
    max = [ 10, 10 ]

[ToolAI]
    num = 2 
    name = "TOOL_AI"
    type = [ 1, 1 ]
    min = [ 0, 0 ]
    max = [ 10, 10 ]

[ToolAO]
    num = 0
    name = "TOOL_AO"

# 以下属IS/S/C系列虚拟的固化功能的联动IO
# 联动IO 输入功能
# RMTON/OFF: 远程开机/关机
[LinkDI]
    num = 1
    label = "Link Input"
    function_lock = true
    name = [ "RMTON/OFF" ]
    sequence = [0]

[SerialPort]
    device_list = ["ttyS7","ttyRobotTool"]
    alias = ["[I/O] 485+,485-","Tool RS485"]
    
[Firmware]
    master_mcu = 'controlbox_S_h100'

# 控制手柄
[Handle]
    intergated = true
    custom_func_key = 'HandGuide' # 回到原点GoHome、拖动示教HandGuide、记录点位RecordPoint、轨迹复现RepeatTrack  

[sensor]
    temperature = false
    humidity = false

[WiFi]
    wnic_intergated = true  # 是否集成无线网卡
    wifi_prefix = "AUBO-S-" # AP WiFi 名字前缀

# 示教方式
[PrimaryHmi]
    default = "webscope" # 默认方式
    allowed = ["webscope"] # 支持的方式

