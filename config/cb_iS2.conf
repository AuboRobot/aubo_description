# 以下属IS/S/C系列虚拟的固化功能的联动IO，硬件无实际功能
# 联动IO 输入功能
# LI00_SLAVE_AUTORUN: 启动工程或者恢复工程
# LI01_SLAVE_STOP: 停止工程
# LI02_SLAVE_PAUSE: 暂停工程
# LI03_SLAVE_ORIGIN_POSE: 回到HOME位姿
# LI04_FUNC_PRESSED: 多功能按钮长按
# LI05_FUNC_CLICKED: 多功能按钮短按
# LI06_FUNC_UP: 多功能按钮高位
# LI07_FUNC_DOWN: 多功能按钮低位

# INPUT_DEFAULT = 0,
# LI00_SLAVE_AUTORUN = 1,
# LI01_SLAVE_STOP = 2,
# LI02_SLAVE_PAUSE = 3,
# LI03_SLAVE_ORIGIN_POSE = 4,
# LI04_FUNC_PRESSED = 5,
# LI05_FUNC_CLICKED = 6,
# LI06_FUNC_UP = 7,
# LI07_FUNC_DOWN = 8,
[LinkDI]
    num = 6
    label = "Link Input"
    function_lock = true
    name = [ "EI0", "EI1", "SI0", "SI1", "RMTON", "RMTOFF" ]
    sequence = [5,  4,  3,  2,  1,  0]
    # function = [ 1, 2, 3, 4, 5, 6, 7, 8 ]    

[ENC]
    num = 1
    name = [ "ENC(IO)" ]
     
[PNPSupport]
    switch_allow = true  # 表示 IO 支持切换到 PNP 模式

[SerialPort]
    device_list = ["ttyS0","ttyS1","ttyS2","ttyIfaceBrd","ttyRobotTool"]
    alias = ["RS485","RS485","RS485","[I/O] 485_A,485_B","Tool RS485"]

[Firmware]
    master_mcu = 'controlbox_iS_h100'
    slave_mcu = 'controlbox_slave_iS_h100' 

[sensor]
    temperature = true
    humidity = true

# 示教方式
[PrimaryHmi]
    default = "aubo_scope" # 默认方式
    allowed = ["webscope", "aubo_scope"] # 支持的方式

