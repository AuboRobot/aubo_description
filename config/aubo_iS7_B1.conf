elbow_speed = [0.1, 0.2, 0.5, 1.0]          # m/s
elbow_force = [100.0, 100.0, 100.0, 100.0]  # N

[ControlBox]
controlBox = 'cb_ISStation.conf'
hardware_interface = 'robot_driver'
teachpendant = 'tp_standard' # 支持有线示教器
cycle_time = 0.005

[Base]
firmware = 'base_iS_h400'

[CANTopo]
