# 以下属于aubo接口板特有的固化功能的联动IO

# 联动IO 输入功能
# START_PROGRAM: 启动工程或者恢复工程
# STOP_PROGRAM: 停止工程
# PAUSE_PROGRAM: 暂停工程
# GO_HOME: 回到HOME位姿
# POPUP_DISMISS: 点击弹窗上的 OK 按键

# 联动IO 输出功能
# Running: 工程正在运行中
# Stopped: 工程已经停止运行
# Paused: 工程被暂停
# AtHome: 机器人当前处于HOME位姿

# INPUT_DEFAULT = 0,
# FREEDRIVE = 1,
# GO_HOME = 2,
# START_PROGRAM = 3,
# STOP_PROGRAM = 4,
# PAUSE_PROGRAM = 5,
# POPUP_DISMISS = 6,
[LinkDI]
    num = 6
    label = "Link Input"
    function_lock = true
    name = [ "EI0", "EI1", "SI0", "SI1", "RMTON", "RMTOFF" ]
    sequence = [5,  4,  3,  2,  1,  0]

[PNPSupport]
    switch_allow = true  # 表示 IO 支持切换到 PNP 模式
    
[SerialPort]
    device_list = ["ttyS2","ttyIfaceBrd","ttyRobotTool"]
    alias = ["RS485","[I/O] 485_A,485_B","Tool RS485"]

[LinkModeButton]
    enable = false

[sensor]
    temperature = true
    humidity = true

# 示教方式
[PrimaryHmi]
    default = "aubo_scope" # 默认方式
    allowed = ["webscope", "aubo_scope"] # 支持的方式

