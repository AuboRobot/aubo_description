# 以下属于aubo接口板特有的固化功能的联动IO

# 联动IO 输入功能
# START_PROGRAM: 启动工程或者恢复工程
# STOP_PROGRAM: 停止工程
# PAUSE_PROGRAM: 暂停工程
# GO_HOME: 回到HOME位姿
# POPUP_DISMISS: 点击弹窗上的 OK 按键

# 联动IO 输出功能
# Running: 工程正在运行中
# Stopped: 工程已经停止运行
# Paused: 工程被暂停
# AtHome: 机器人当前处于HOME位姿

# INPUT_DEFAULT = 0,
# FREEDRIVE = 1,
# GO_HOME = 2,
# START_PROGRAM = 3,
# STOP_PROGRAM = 4,
# PAUSE_PROGRAM = 5,
# POPUP_DISMISS = 6,
[LinkDI]
    num = 0
    label = "Link Input"
    function_lock = true
    name = [ "CI00", "CI01", "CI02", "CI03", "CI10", "CI11", "CI12", "CI13", 
             "LI00", "LI01", "LI02", "LI03", "LI04", "LI05", 
             "F1",   "F2",   "F3",   "F4",   "F5",   "F6" ]
    function = [ 0, 0, 0, 0, 0, 0, 0, 0,
                 3, 4, 5, 2, 0, 0,
                 0, 0, 0, 0, 0, 6 ]

