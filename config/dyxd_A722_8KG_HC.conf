elbow_force = [100.0, 100.0, 100.0, 100.0]  # N

[ControlBox]
controlBox = 'cb_PStation.conf'
hardware_interface = 'ecat_robot'

[SafeguardStop]
servo_disable = true # SafetyStop 之后伺服失能
